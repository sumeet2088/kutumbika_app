org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=true
# Keep built-in Kotlin off: Flutter and plugins still apply kotlin-android.
# Enabling this (true) makes AGP 9 reject that plugin and assembleDebug fails.
android.builtInKotlin=false
android.newDsl=false
